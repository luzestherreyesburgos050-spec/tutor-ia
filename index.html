<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor IA - Acceso Privado</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0f172a; color: white; font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; padding: 15px; }
        #bloqueo { text-align: center; background: #1e293b; padding: 35px 25px; border-radius: 16px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 400px; }
        h2 { margin-bottom: 8px; font-size: 1.6rem; color: #38bdf8; }
        p { margin-bottom: 24px; color: #94a3b8; font-size: 0.95rem; line-height: 1.4; }
        input { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 1.1rem; text-align: center; margin-bottom: 16px; outline: none; }
        input:focus { border-color: #38bdf8; }
        button { width: 100%; padding: 14px; background: #38bdf8; color: #0f172a; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #7dd3fc; }
        #error { color: #f87171; margin-top: 12px; font-size: 0.95rem; display: none; font-weight: 500; }
        #coze-chat-container { width: 100%; height: 100vh; display: none; }
    </style>
    <!-- Cargamos el componente oficial de Coze con sus etiquetas correctas -->
    <script src="https://coze.com"></script>
</head>
<body>

    <!-- PANTALLA DE LOGEO -->
    <div id="bloqueo">
        <h2>🔑 Acceso al Tutor</h2>
        <p>Introduce el código único que le compraste a tu proveedor para activar la Inteligencia Artificial.</p>
        <input type="text" id="pin-usuario" placeholder="Escribe tu código aquí" autocomplete="off">
        <button onclick="validar()">Desbloquear IA</button>
        <p id="error">❌ Código inválido. Verifica o pide uno nuevo.</p>
    </div>

    <!-- AQUÍ SE PINTARÁ EL CHAT DE COZE -->
    <div id="coze-chat-container"></div>

    <!-- AQUÍ INICIA LA PROGRAMACIÓN CON LOS SIGNOS CORRECTOS -->
    <script>
        const misCodigosSecretos = ["TAREA_PRO_1", "CHAYITO_2026", "PIN_SECRETO_99", "ESTUDIANTE_VIP"];

        function cargarChatIA(https://www.coze.com/store/agent/7701032524495044613?from=bots_card&bid=6lo58m2r11g05
) {
            document.getElementById("coze-chat-container").style.display = "block";
            new CozeWebChat.ChatSlot({
                config: {
                    bot_id: '7701032524495044613', 
                },
                componentProps: {
                    title: 'Tutor Inteligente Pro',
                },
                el: document.getElementById('coze-chat-container'),
            });
        }

        function validar() {
            const input = document.getElementById("pin-usuario").value.trim().toUpperCase();
            const error = document.getElementById("error");
            const pantallaLogin = document.getElementById("bloqueo");

            if (misCodigosSecretos.includes(input)) {
                pantallaLogin.style.display = "none";
                cargarChatIA();
            } else {
                error.style.display = "block";
                document.getElementById("pin-usuario").value = "";
            }
        }
    </script>
</body>
</html>
